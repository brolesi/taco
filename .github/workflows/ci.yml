name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Windows entra na matriz por causa dos CSVs: o teste de reprodutibilidade
    # compara bytes, e é lá que a quebra de linha nativa difere.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Formatação (ruff format)
        run: ruff format --check .

      - name: Esquema dos dados (frictionless)
        run: frictionless validate datapackage.json

      - name: Testes (pytest)
        run: pytest

  docker:
    # Não há Docker na máquina de desenvolvimento: é aqui que o Dockerfile é testado.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build da imagem
        run: docker build -t taco .

      - name: A API sobe e responde
        run: |
          docker run -d -p 8000:8000 taco
          curl -fsS --retry 15 --retry-all-errors --retry-delay 1 http://localhost:8000/health
          curl -fsS http://localhost:8000/foods/561 | grep -q "\"id\":561"
