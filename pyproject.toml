[project]
name = "taco"
version = "1.7.0"
description = "Dados normalizados e API REST da Tabela Brasileira de Composição de Alimentos (TACO)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Fabio Fogliarini Brolesi" }]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Idioma do FastAPI: chamadas em valores-padrão de parâmetros.
extend-immutable-calls = ["fastapi.Query", "fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
